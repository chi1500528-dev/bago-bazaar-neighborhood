# Netlify build for the TanStack Start app.
# Nitro emits static files to dist/ and the server function to
# .netlify/functions-internal/server (picked up by Netlify automatically).
[build]
  command = "npm run build"
  publish = "dist"

# Send old Netlify address to the primary custom domain.
[[redirects]]
  from = "https://bagomarket.netlify.app/*"
  to = "https://bagomarket.shop/:splat"
  status = 301
  force = true

# Disable HTTP/3 (QUIC over UDP) — often dropped by Myanmar mobile networks,
# causing ERR_QUIC_PROTOCOL_ERROR. Browsers stay on reliable HTTP/2.
[[headers]]
  for = "/*"
  [headers.values]
    Alt-Svc = "clear"

[build.environment]
  NITRO_PRESET = "netlify"
  NODE_VERSION = "22"
  # Public (publishable) Supabase settings; also set SUPABASE_URL and
  # SUPABASE_PUBLISHABLE_KEY in Netlify UI if .env is not committed.
